<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>درخشا | هوش مصنوعی درخت دانش</title>
<meta name="description" content="سامانه هوش مصنوعی فارسی با معماری درخت دانش — طراحی مفهومی گروک و احمدرضا ایزدی">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="درخشا">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top bar -->
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#" onclick="show('chat');return false">
        <img src="logo.png" alt="درخشا" class="brand-logo" width="32" height="32">
        <span>هوش <em>درخشا</em></span>
      </a>
      <div class="actions">
        <button type="button" class="btn btn-p" id="authBtnTop" onclick="show('auth')">ورود</button>
        <button type="button" class="icon" id="th" onclick="theme()" title="تغییر تم">☾</button>
        <button type="button" class="icon" onclick="openHist()" title="تاریخچه">☰</button>
        <button type="button" class="icon" onclick="newChat()" title="گفتگوی جدید">＋</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <!-- Chat view -->
    <section class="view on" id="v-chat">
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <button type="button" class="send" id="sendBtn" onclick="send()" aria-label="ارسال">↑</button>
        <textarea id="inp" rows="1" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="autoH(this)"></textarea>
      </div>
    </section>

    <!-- Auth view -->
    <section class="view" id="v-auth">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="logo.png" alt="درخشا" width="72" height="72">
        </div>
        <h2 id="authTitle">ورود به درخشا</h2>
        <p class="auth-sub" id="authSub">با شماره همراه وارد شوید</p>
        <div id="authForm">
          <label class="field">
            <span>نام</span>
            <input type="text" id="nameIn" placeholder="نام شما" autocomplete="name">
          </label>
          <label class="field">
            <span>شماره همراه</span>
            <input type="tel" id="phoneIn" placeholder="09xxxxxxxxx" inputmode="numeric" autocomplete="tel">
          </label>
          <div id="otpF" style="display:none">
            <label class="field">
              <span>کد تأیید</span>
              <input type="text" id="otpIn" placeholder="کد ۶ رقمی" inputmode="numeric" maxlength="6">
            </label>
            <p class="hint">کد آزمایشی: <strong>123456</strong></p>
          </div>
          <button type="button" class="btn btn-p full" id="authBtn" onclick="doAuth()">دریافت کد</button>
        </div>
        <div id="authLogged" style="display:none">
          <p class="logged-info">شما وارد شده‌اید</p>
          <p id="userInfo" class="user-info"></p>
          <button type="button" class="btn full" onclick="logout()">خروج</button>
          <button type="button" class="btn full mt" onclick="show('chat')">بازگشت به گفتگو</button>
        </div>
      </div>
    </section>
  </main>

  <!-- History drawer -->
  <aside class="drawer" id="dr">
    <div class="dr-head">
      <strong>تاریخچه گفتگو</strong>
      <button type="button" class="icon" onclick="closeAll()">×</button>
    </div>
    <div class="dr-list" id="hist"></div>
  </aside>
  <div class="overlay" id="ov" onclick="closeAll()"></div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-in">
      <div class="modal-head">
        <strong id="mt"></strong>
        <button type="button" class="icon" onclick="closeAll()">×</button>
      </div>
      <div class="modal-body" id="mb"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer class="foot">
    <a href="#" onclick="show('auth');return false">ورود</a>
    ·
    <a href="#" onclick="rules();return false">قوانین درخشا</a>
    ·
    <a href="#" onclick="creators();return false">سازندگان</a>
    <div class="copy">© <span id="y"></span> درخت دانش <strong>درخشا</strong> — تمامی حقوق محفوظ است</div>
  </footer>

  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
