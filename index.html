<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخشا</title>
<meta name="theme-color" content="#09090b">
<style>
:root {
  --bg: #09090b;
  --bg2: #0c0c0f;
  --card: #12121a;
  --line: #1f1f2e;
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --accent: #22d3ee;
  --accent2: #a78bfa;
  --accent3: #3b82f6;
  --danger: #fb7185;
  --radius: 14px;
  --font: "Segoe UI", Tahoma, system-ui, sans-serif;
}
[data-theme="light"] {
  --bg: #fafafa;
  --bg2: #f4f4f5;
  --card: #ffffff;
  --line: #e4e4e7;
  --text: #09090b;
  --muted: #71717a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* —— Header —— */
.top {
  height: 60px;
  border-bottom: 1px solid var(--line);
  background: rgba(9,9,11,.85);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 30;
}
[data-theme="light"] .top { background: rgba(250,250,250,.9); }
.top-inner {
  max-width: 960px;
  margin: 0 auto;
  height: 100%;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.brand svg { width: 34px; height: 34px; }
.brand em {
  font-style: normal;
  background: linear-gradient(135deg, #22d3ee, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 0.95rem;
}
[data-theme="light"] .icon-btn { color: #09090b; }
.icon-btn:hover { border-color: var(--accent); }
.btn {
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { border-color: var(--accent); }
.btn-primary {
  border: none;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #fff;
}
.btn-primary:hover { filter: brightness(1.08); border: none; }

/* —— Layout —— */
.shell {
  max-width: 960px;
  margin: 0 auto;
  min-height: calc(100vh - 60px - 72px);
  display: flex;
  flex-direction: column;
}
.view { display: none; flex: 1; flex-direction: column; min-height: 0; }
.view.on { display: flex; }

/* —— Chat —— */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.hero {
  margin: auto;
  text-align: center;
  max-width: 440px;
  padding: 20px 8px 40px;
}
.hero svg { width: 88px; height: 88px; margin-bottom: 14px; }
.hero h1 {
  font-size: 1.5rem;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
  font-weight: 700;
}
.hero p { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.suggestions button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: inherit;
}
.suggestions button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.msg-user {
  align-self: flex-end;
  max-width: min(78%, 520px);
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #fff;
  padding: 12px 16px;
  border-radius: 16px 16px 4px 16px;
  font-size: 0.92rem;
}
.msg-bot-wrap {
  align-self: flex-start;
  display: flex;
  gap: 10px;
  max-width: min(88%, 560px);
  align-items: flex-end;
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.avatar svg { width: 20px; height: 20px; }
.msg-bot {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 12px 16px;
  border-radius: 16px 16px 16px 4px;
  font-size: 0.92rem;
}
.meta {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 6px;
}
.msg-user .meta { color: rgba(255,255,255,.7); }
.pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.pill {
  font-size: 0.65rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(34,211,238,.12);
  color: var(--accent);
}

.typing-wrap {
  align-self: flex-start;
  display: flex;
  gap: 10px;
  align-items: center;
}
.typing {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  gap: 5px;
}
.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.35;
}
.typing span:nth-child(1) { opacity: 1; }
.typing span:nth-child(2) { opacity: 0.65; }

.composer-bar {
  border-top: 1px solid var(--line);
  padding: 12px 16px 16px;
  background: var(--bg);
}
.composer {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 8px 8px 8px 14px;
}
.composer:focus-within {
  border-color: rgba(34,211,238,.5);
  box-shadow: 0 0 0 3px rgba(34,211,238,.08);
}
#inp {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.92rem;
  resize: none;
  outline: none;
  max-height: 120px;
  padding: 8px 0;
  line-height: 1.5;
}
#send {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #fff;
  font-size: 1.05rem;
  cursor: pointer;
  flex-shrink: 0;
}

/* —— Auth —— */
.auth-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.auth-card {
  width: min(400px, 100%);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px 24px;
}
.auth-card .mark {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}
.auth-card .mark svg { width: 52px; height: 52px; }
.auth-card h1 {
  text-align: center;
  font-size: 1.25rem;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.auth-card .sub {
  text-align: center;
  color: var(--muted);
  font-size: 0.86rem;
  margin-bottom: 22px;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  outline: none;
}
.field input:focus { border-color: var(--accent); }
.auth-card .btn-primary { width: 100%; height: 44px; justify-content: center; margin-top: 4px; }
.hint {
  text-align: center;
  color: var(--muted);
  font-size: 0.78rem;
  margin-top: 14px;
}
.hint strong { color: var(--accent); }
.user-line {
  text-align: center;
  color: var(--accent);
  font-weight: 600;
  margin: 12px 0 16px;
}

/* —— History drawer —— */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 40;
}
.overlay.on { display: block; }
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: min(320px, 90vw);
  height: 100%;
  background: var(--bg2);
  border-left: 1px solid var(--line);
  z-index: 41;
  transform: translateX(105%);
  transition: transform .2s ease;
  display: flex;
  flex-direction: column;
}
.drawer.on { transform: translateX(0); }
.drawer-h {
  height: 60px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
  font-size: 0.9rem;
}
.drawer-list { flex: 1; overflow-y: auto; padding: 10px; }
.hist {
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
  margin-bottom: 6px;
}
.hist.active { border-color: var(--accent); }
.hist button.pick {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  text-align: right;
  cursor: pointer;
  font: inherit;
  min-width: 0;
}
.hist .t {
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hist .d { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.hist .del {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--danger);
  cursor: pointer;
  flex-shrink: 0;
}
.empty { text-align: center; color: var(--muted); padding: 32px 12px; font-size: 0.85rem; }

/* —— Footer —— */
.foot {
  border-top: 1px solid var(--line);
  padding: 18px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
}
.foot-links { margin-bottom: 8px; }
.foot-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.78rem;
}
.foot-links a:hover { color: var(--accent); }
.foot-links .dot { margin: 0 8px; opacity: .4; }
.foot strong { color: var(--accent); }

/* —— Modal —— */
.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 92vw);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  z-index: 50;
  max-height: 80vh;
  overflow: auto;
}
.modal.on { display: block; }
.modal-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
  font-size: 0.9rem;
}
.modal-h button {
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
}
.modal-b {
  padding: 16px;
  color: var(--muted);
  font-size: 0.86rem;
}
.modal-b ul { padding-right: 18px; margin: 8px 0; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #27272a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 60;
}
.toast.on { opacity: 1; }

@media (max-width: 560px) {
  .brand span.text { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#" onclick="showChat();return false;">
      <!-- پنج‌ضلعی تو در تو -->
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="50%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <!-- outer -->
        <path d="M32 6 L56 24 L47 54 L17 54 L8 24 Z" stroke="url(#pg)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
        <!-- mid -->
        <path d="M32 14 L48 27 L42 48 L22 48 L16 27 Z" stroke="url(#pg)" stroke-width="1.8" fill="none" stroke-linejoin="round" opacity="0.9"/>
        <!-- inner -->
        <path d="M32 22 L40 30 L37 42 L27 42 L24 30 Z" stroke="url(#pg)" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0.85"/>
        <!-- core -->
        <circle cx="32" cy="34" r="3.5" fill="url(#pg)"/>
      </svg>
      <span class="text">هوش <em>درخشا</em></span>
    </a>
    <div class="top-actions">
      <button type="button" class="btn" onclick="newChat()" title="گفتگوی جدید">＋ جدید</button>
      <button type="button" class="icon-btn" onclick="openHistory()" title="تاریخچه">☰</button>
      <button type="button" class="icon-btn" id="themeBtn" onclick="toggleTheme()" style="color:#fff" title="تم">☾</button>
      <button type="button" class="btn btn-primary" id="navAuth" onclick="showAuth()">ورود</button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay" onclick="closeDrawers()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <span>تاریخچه</span>
    <button type="button" class="btn" style="height:30px;padding:0 10px" onclick="closeDrawers()">بستن</button>
  </div>
  <div class="drawer-list" id="historyList"></div>
</aside>

<div class="shell">
  <!-- CHAT (default, no nav item) -->
  <section class="view on" id="view-chat">
    <div class="messages" id="msgs"></div>
    <div class="composer-bar">
      <div class="composer">
        <textarea id="inp" rows="1" placeholder="پیام خود را بنویسید..."  oninput="autoH(this)"></textarea>
        <button type="button" id="send" onclick="send()">↑</button>
      </div>
    </div>
  </section>

  <!-- AUTH -->
  <section class="view" id="view-auth">
    <div class="auth-wrap">
      <div class="auth-card" id="authBox">
        <div class="mark">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="pg2" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <path d="M32 6 L56 24 L47 54 L17 54 L8 24 Z" stroke="url(#pg2)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
            <path d="M32 14 L48 27 L42 48 L22 48 L16 27 Z" stroke="url(#pg2)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
            <path d="M32 22 L40 30 L37 42 L27 42 L24 30 Z" stroke="url(#pg2)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
            <circle cx="32" cy="34" r="3.5" fill="url(#pg2)"/>
          </svg>
        </div>
        <div id="authForm">
          <h1>ورود به درخشا</h1>
          <p class="sub">نام و شماره همراه خود را وارد کنید</p>
          <div class="field">
            <label>نام</label>
            <input id="nameInput" type="text" placeholder="نام شما" maxlength="40" autocomplete="name">
          </div>
          <div class="field">
            <label>شماره همراه</label>
            <input id="phoneInput" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" autocomplete="tel">
          </div>
          <div class="field" id="otpField" style="display:none">
            <label>کد تأیید</label>
            <input id="otpInput" type="text" inputmode="numeric" placeholder="------" maxlength="6">
          </div>
          <button type="button" class="btn btn-primary" id="authBtn" onclick="authStep()">دریافت کد تأیید</button>
          <p class="hint">کد آزمایشی: <strong>123456</strong></p>
        </div>
        <div id="authDone" style="display:none">
          <h1>حساب کاربری</h1>
          <p class="user-line" id="authInfo"></p>
          <button type="button" class="btn" style="width:100%;justify-content:center;margin-bottom:8px" onclick="logout()">خروج</button>
          <button type="button" class="btn btn-primary" onclick="showChat()">بازگشت به گفتگو</button>
        </div>
      </div>
    </div>
  </section>
</div>

<footer class="foot">
  <div class="foot-links">
    <a href="#" onclick="showAuth();return false;">ورود</a>
    <span class="dot">|</span>
    <a href="#" onclick="showRules();return false;">قوانین درخشا</a>
    <span class="dot">|</span>
    <a href="#" onclick="showCreators();return false;">سازندگان</a>
  </div>
  <div>© <span id="y"></span> درخت دانش <strong>درخشا</strong> — تمامی حقوق محفوظ است</div>
  <div style="margin-top:4px">سازندگان: <strong>گروک</strong> و <strong>احمدرضا ایزدی</strong></div>
</footer>

<div class="modal" id="modal">
  <div class="modal-h"><span id="modalTitle"></span><button type="button" onclick="closeModal()">×</button></div>
  <div class="modal-b" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const MARK = `<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="m" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><path d="M32 6 L56 24 L47 54 L17 54 L8 24 Z" stroke="url(#m)" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M32 14 L48 27 L42 48 L22 48 L16 27 Z" stroke="url(#m)" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M32 22 L40 30 L37 42 L27 42 L24 30 Z" stroke="url(#m)" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="32" cy="34" r="3.2" fill="url(#m)"/></svg>`;

const CORE = [
  {q:"درخشا چیست؟", a:"درخشا یک سامانه هوش مصنوعی فارسی با معماری درخت دانش است.", branch:"SELF", conf:96},
  {q:"درخت دانش چیست؟", a:"درخت دانش ساختار سلسله‌مراتبی با ریشه درخشا است؛ هر شاخه یک حوزه و هر مفهوم یک گره است.", branch:"ARCH", conf:94},
  {q:"چه قابلیت‌هایی دارد؟", a:"قشر زبان، درخت دانش، یادگیری، پیوند گفتگو و امتیاز اطمینان از قابلیت‌های اصلی درخشا هستند.", branch:"ARCH", conf:93},
  {q:"سازندگان کیانند؟", a:"درخشا توسط گروک و احمدرضا ایزدی طراحی شده است.", branch:"SELF", conf:98},
  {q:"سلام", a:"سلام. سامانه درخشا آماده دریافت پرسش شماست.", branch:"CHAT", conf:90}
];

let user = JSON.parse(localStorage.getItem("derakhsha_user") || "null");
let sessions = JSON.parse(localStorage.getItem("derakhsha_sessions") || "[]");
let currentId = localStorage.getItem("derakhsha_current") || null;
let authPhase = "form";

function save() {
  localStorage.setItem("derakhsha_sessions", JSON.stringify(sessions));
  if (currentId) localStorage.setItem("derakhsha_current", currentId);
}
function cur() { return sessions.find(s => s.id === currentId) || null; }
function ensure() {
  if (currentId && cur()) return cur();
  const s = { id: "s_" + Date.now(), title: "گفتگوی جدید", messages: [], updated: Date.now() };
  sessions.unshift(s); currentId = s.id; save(); return s;
}

function showChat() {
  document.getElementById("view-chat").classList.add("on");
  document.getElementById("view-auth").classList.remove("on");
  closeDrawers();
}
function showAuth() {
  document.getElementById("view-auth").classList.add("on");
  document.getElementById("view-chat").classList.remove("on");
  renderAuth();
  closeDrawers();
}

function hero() {
  return `<div class="hero" id="welcome">
    ${MARK.replace('viewBox', 'width="88" height="88" viewBox')}
    <h1>درخشا</h1>
    <p>سامانه هوش مصنوعی فارسی با معماری درخت دانش</p>
    <div class="suggestions">
      <button type="button" onclick="ask(this)">درخشا چیست؟</button>
      <button type="button" onclick="ask(this)">درخت دانش چیست؟</button>
      <button type="button" onclick="ask(this)">سازندگان کیانند؟</button>
    </div>
  </div>`;
}

function renderMsgs() {
  const box = document.getElementById("msgs");
  const s = cur();
  if (!s || !s.messages.length) { box.innerHTML = hero(); return; }
  box.innerHTML = "";
  s.messages.forEach(m => {
    if (m.role === "user") addUser(m.text, false);
    else addBot(m.text, m.meta, false);
  });
  box.scrollTop = box.scrollHeight;
}

function renderHistory() {
  const list = document.getElementById("historyList");
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">گفتگویی نیست</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const d = new Date(s.updated).toLocaleString("fa-IR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<div class="hist ${s.id === currentId ? "active" : ""}">
      <button type="button" class="pick" onclick="loadSession('${s.id}')">
        <div class="t">${esc(s.title)}</div>
        <div class="d">${d} · ${s.messages.length} پیام</div>
      </button>
      <button type="button" class="del" onclick="deleteSession('${s.id}', event)" title="حذف">×</button>
    </div>`;
  }).join("");
}

function loadSession(id) {
  currentId = id; save(); renderMsgs(); renderHistory(); showChat();
}
function deleteSession(id, ev) {
  if (ev) ev.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  if (currentId === id) {
    currentId = sessions[0] ? sessions[0].id : null;
    if (!currentId) ensure();
  }
  save(); renderHistory(); renderMsgs(); toast("حذف شد");
}
function newChat() {
  const s = { id: "s_" + Date.now(), title: "گفتگوی جدید", messages: [], updated: Date.now() };
  sessions.unshift(s); currentId = s.id; save();
  showChat(); renderMsgs(); renderHistory(); toast("گفتگوی جدید");
}
function openHistory() {
  document.getElementById("drawer").classList.add("on");
  document.getElementById("overlay").classList.add("on");
  renderHistory();
}
function closeDrawers() {
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("overlay").classList.remove("on");
  closeModal();
}

function answer(q) {
  const qt = q.toLowerCase();
  let best = null, score = 0;
  for (const item of CORE) {
    const qs = item.q.toLowerCase();
    let sc = 0;
    if (qt.includes(qs) || qs.includes(qt)) sc = 0.95;
    else {
      const words = qt.split(/\s+/).filter(w => w.length > 2);
      sc = words.filter(w => qs.includes(w) || item.a.includes(w)).length / Math.max(words.length, 1);
    }
    if (sc > score) { score = sc; best = item; }
  }
  if (best && score >= 0.28) return { text: best.a, src: "هسته دانش", conf: best.conf, branch: best.branch };
  return { text: "مسیر مطمئنی فعال نشد. پرسش را دقیق‌تر بنویسید.", src: "سامانه", conf: 15, branch: "—" };
}

function send() {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if (!text) return;
  const s = ensure();
  if (s.title === "گفتگوی جدید") s.title = text.slice(0, 36) + (text.length > 36 ? "…" : "");
  const w = document.getElementById("welcome");
  if (w) w.remove();
  s.messages.push({ role: "user", text });
  addUser(text, true);
  inp.value = ""; autoH(inp);
  s.updated = Date.now(); save();
  showTyping();
  setTimeout(() => {
    hideTyping();
    const r = answer(text);
    s.messages.push({ role: "bot", text: r.text, meta: r });
    s.updated = Date.now(); save();
    addBot(r.text, r, true);
    renderHistory();
  }, 500);
}

function showTyping() {
  const box = document.getElementById("msgs");
  const el = document.createElement("div");
  el.className = "typing-wrap";
  el.id = "typingRow";
  el.innerHTML = `<div class="avatar">${MARK}</div><div class="typing"><span></span><span></span><span></span></div>`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typingRow");
  if (t) t.remove();
}

function addUser(text, scroll) {
  const box = document.getElementById("msgs");
  const t = new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
  const d = document.createElement("div");
  d.className = "msg-user";
  d.innerHTML = esc(text) + `<div class="meta">${t}</div>`;
  box.appendChild(d);
  if (scroll) box.scrollTop = box.scrollHeight;
}
function addBot(text, meta, scroll) {
  const box = document.getElementById("msgs");
  const t = new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
  const row = document.createElement("div");
  row.className = "msg-bot-wrap";
  let h = `<div class="avatar">${MARK}</div><div class="msg-bot">${esc(text)}`;
  if (meta) {
    h += `<div class="pill-row">`;
    if (meta.src) h += `<span class="pill">${esc(meta.src)}</span>`;
    if (meta.conf != null) h += `<span class="pill">${meta.conf}٪</span>`;
    h += `</div>`;
  }
  h += `<div class="meta">درخشا · ${t}</div></div>`;
  row.innerHTML = h;
  box.appendChild(row);
  if (scroll) box.scrollTop = box.scrollHeight;
}

function ask(btn) { document.getElementById("inp").value = btn.textContent; send(); }
function onKey(e) {
  // fixed below
}
document.getElementById("inp").onkeydown = function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
function autoH(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function renderAuth() {
  if (user && user.phone) {
    document.getElementById("authForm").style.display = "none";
    document.getElementById("authDone").style.display = "block";
    document.getElementById("authInfo").textContent = (user.name ? user.name + " · " : "") + user.phone;
    document.getElementById("navAuth").textContent = "حساب";
  } else {
    document.getElementById("authDone").style.display = "none";
    document.getElementById("authForm").style.display = "block";
    document.getElementById("otpField").style.display = authPhase === "otp" ? "block" : "none";
    document.getElementById("authBtn").textContent = authPhase === "otp" ? "ورود" : "دریافت کد تأیید";
    document.getElementById("navAuth").textContent = "ورود";
  }
}
function authStep() {
  if (authPhase === "form") {
    const name = document.getElementById("nameInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    if (!name) { toast("نام را وارد کنید"); return; }
    if (!/^09\d{9}$/.test(phone)) { toast("شماره: 09xxxxxxxxx"); return; }
    sessionStorage.setItem("derakhsha_pending", JSON.stringify({ name, phone }));
    authPhase = "otp";
    document.getElementById("otpField").style.display = "block";
    document.getElementById("authBtn").textContent = "ورود";
    toast("کد: 123456");
  } else {
    if (document.getElementById("otpInput").value.trim() !== "123456") { toast("کد نادرست"); return; }
    const pending = JSON.parse(sessionStorage.getItem("derakhsha_pending") || "{}");
    user = { name: pending.name, phone: pending.phone, loggedAt: new Date().toISOString() };
    localStorage.setItem("derakhsha_user", JSON.stringify(user));
    authPhase = "form";
    document.getElementById("otpInput").value = "";
    renderAuth();
    toast("ورود موفق");
  }
}
function logout() {
  user = null;
  localStorage.removeItem("derakhsha_user");
  authPhase = "form";
  document.getElementById("otpField").style.display = "none";
  document.getElementById("authBtn").textContent = "دریافت کد تأیید";
  renderAuth();
  toast("خارج شدید");
}

function toggleTheme() {
  const next = (document.documentElement.getAttribute("data-theme") || "dark") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  const btn = document.getElementById("themeBtn");
  if (next === "dark") { btn.textContent = "☾"; btn.style.color = "#fff"; }
  else { btn.textContent = "☀"; btn.style.color = "#09090b"; }
}

function showRules() {
  document.getElementById("modalTitle").textContent = "قوانین درخشا";
  document.getElementById("modalBody").innerHTML = `<ul>
    <li>استفاده صرفاً برای اهداف قانونی و اخلاقی</li>
    <li>مسئولیت محتوای ارسالی با کاربر است</li>
    <li>اطلاعات حساب برای ورود و بهبود سرویس</li>
    <li>پاسخ‌ها راهنما هستند، نه جایگزین تخصص قطعی</li>
    <li>سوءاستفاده و نقض حریم خصوصی ممنوع است</li>
  </ul><p style="margin-top:10px">با استفاده از سامانه این قوانین را می‌پذیرید.</p>`;
  openModal();
}
function showCreators() {
  document.getElementById("modalTitle").textContent = "سازندگان";
  document.getElementById("modalBody").innerHTML = `<p><strong style="color:var(--accent)">گروک</strong> و <strong style="color:var(--accent)">احمدرضا ایزدی</strong></p>
  <p style="margin-top:8px">طراحی و توسعه مفهومی سامانه هوش مصنوعی درخشا.</p>`;
  openModal();
}
function openModal() {
  document.getElementById("modal").classList.add("on");
  document.getElementById("overlay").classList.add("on");
}
function closeModal() {
  document.getElementById("modal").classList.remove("on");
}

function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2000);
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("y").textContent = new Date().getFullYear();
  if (!sessions.length) ensure();
  else if (!currentId || !cur()) currentId = sessions[0].id;
  renderMsgs();
  renderHistory();
  renderAuth();
});
</script>
</body>
</html>
