<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخشا | هوش مصنوعی درخت دانش</title>
<meta name="theme-color" content="#0b1220">
<style>
:root {
  --bg: #0b1220;
  --surface: #152238;
  --border: #243656;
  --text: #e8eef8;
  --muted: #8b9bb8;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --blue: #3b82f6;
  --font: Tahoma, "Segoe UI", system-ui, sans-serif;
}
[data-theme="light"] {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --border: #cfd8e6;
  --text: #0f1a2e;
  --muted: #5a6d8a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* Header compact */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
}
.logo svg { width: 32px; height: 32px; flex-shrink: 0; }
.logo span b { color: var(--cyan); font-weight: 700; }

nav {
  display: flex;
  gap: 2px;
  margin-inline: auto;
}
nav button {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
nav button:hover { color: var(--text); background: var(--surface); }
nav button.active { color: var(--cyan); background: rgba(34,211,238,0.12); }

.actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.actions button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  line-height: 1;
}
[data-theme="light"] .actions button { color: #0f1a2e; }
.actions button:hover { border-color: var(--cyan); }
.btn-new {
  width: auto !important;
  padding: 0 10px;
  gap: 4px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text) !important;
}
.btn-new i { color: var(--cyan); font-style: normal; font-size: 1.1rem; }

/* Pages */
main { max-width: 900px; margin: 0 auto; min-height: calc(100% - 56px - 48px); }
.page { display: none; }
.page.active { display: block; }

/* Chat */
.chat-page {
  display: none;
  height: calc(100vh - 56px - 88px);
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
}
.chat-page.active { display: flex; }

.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.welcome {
  margin: auto;
  text-align: center;
  max-width: 420px;
  padding: 24px 12px;
}
.welcome svg { width: 72px; height: 72px; margin-bottom: 8px; }
.welcome h1 { font-size: 1.25rem; margin-bottom: 6px; }
.welcome p { color: var(--muted); font-size: 0.88rem; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chips button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: inherit;
}
.chips button:hover { border-color: var(--cyan); }

.row-bot { display: flex; gap: 8px; align-items: flex-end; align-self: flex-start; max-width: 90%; }
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.avatar svg { width: 24px; height: 24px; }
.avatar.busy { border-color: var(--cyan); }

.bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
  max-width: 100%;
}
.bubble.bot {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-right-radius: 4px;
}
.bubble.user {
  align-self: flex-end;
  background: #1d4ed8;
  color: #fff;
  border-bottom-left-radius: 4px;
  max-width: 84%;
}
.meta { font-size: 0.68rem; opacity: 0.65; margin-top: 4px; }
.tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(34,211,238,0.12);
  color: var(--cyan);
}

.typing {
  display: flex;
  gap: 4px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.typing i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan);
  display: block;
  opacity: 0.4;
}
.typing i:nth-child(1) { opacity: 1; }
.typing i:nth-child(2) { opacity: 0.7; }
.typing i:nth-child(3) { opacity: 0.4; }

.composer {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  background: var(--bg);
}
.composer-inner {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  padding: 6px 8px;
}
.composer-inner:focus-within { border-color: var(--cyan); }
#inp {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.9rem;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 100px;
  padding: 6px 4px;
  line-height: 1.5;
}
#send {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  flex-shrink: 0;
}

/* History drawer */
.drawer-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 30;
}
.drawer-bg.open { display: block; }
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: min(300px, 88vw);
  height: 100%;
  background: var(--bg);
  border-left: 1px solid var(--border);
  z-index: 31;
  transform: translateX(105%);
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.9rem;
}
.drawer-list { flex: 1; overflow-y: auto; padding: 8px; }
.hist {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  margin-bottom: 4px;
  background: var(--surface);
}
.hist.active { border-color: var(--cyan); }
.hist-main {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text);
  text-align: right;
  font-family: inherit;
  padding: 2px;
}
.hist-main .t {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hist-main .d { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.hist-del {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: transparent;
  color: #f87171;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  font-size: 0.85rem;
}
.hist-empty { text-align: center; color: var(--muted); padding: 24px; font-size: 0.85rem; }

/* About / Auth */
.panel { padding: 24px 14px; max-width: 640px; margin: 0 auto; }
.panel h1 { font-size: 1.25rem; margin-bottom: 6px; }
.panel .lead { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: 0.9rem;
  color: var(--cyan);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.card p, .card li { color: var(--muted); font-size: 0.86rem; margin-bottom: 6px; }
.card ul { padding-right: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
}
.field input:focus { border-color: var(--cyan); }
.btn {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  margin-top: 4px;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.center { text-align: center; }
.muted { color: var(--muted); font-size: 0.8rem; }

/* footer styles extended below */

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blue);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 50;
}
.toast.show { opacity: 1; }

@media (max-width: 640px) {
  nav { display: none; }
  .nav-mobile { display: flex !important; }
  .btn-new span.txt { display: none; }
}
.nav-mobile {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 20;
  justify-content: space-around;
  align-items: center;
}
.nav-mobile button {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  padding: 6px 10px;
}
.nav-mobile button.active { color: var(--cyan); }
@media (max-width: 640px) {
  .chat-page { height: calc(100vh - 56px - 52px - 20px); }
  footer { display: none; }
}

footer {
  height: auto;
  min-height: 48px;
  padding: 16px 12px;
  display: block;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.75rem;
  text-align: center;
}
.footer-inner { max-width: 640px; margin: 0 auto; }
.footer-links { margin-bottom: 8px; }
.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 0.78rem;
}
.footer-links a:hover { color: var(--cyan); }
.footer-links .sep { margin: 0 8px; opacity: 0.5; }
.footer-copy { margin-bottom: 4px; }
.footer-copy strong { color: var(--cyan); }
.footer-authors strong { color: var(--cyan); }
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 40;
}
.modal-bg.open { display: block; }
.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 92vw);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  z-index: 41;
  max-height: 80vh;
  overflow: auto;
}
.modal.open { display: block; }
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
.modal-x {
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  line-height: 1;
}
.modal-body {
  padding: 14px;
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.7;
}
.modal-body ul { padding-right: 18px; margin: 8px 0; }

</style>
</head>
<body>

<header>
  <a class="logo" href="#" onclick="go('chat'); return false;">
    <!-- درخت با ۸ شاخه شبیه نورون -->
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="ng" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#22d3ee"/>
          <stop offset="100%" stop-color="#a78bfa"/>
        </linearGradient>
      </defs>
      <!-- trunk -->
      <path d="M32 56 V28" stroke="url(#ng)" stroke-width="3.2" stroke-linecap="round"/>
      <!-- 6 neuron-like branches -->
      <path d="M32 36 L12 18" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 34 L20 12" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 32 L32 8" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 34 L44 12" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 36 L52 18" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 40 L50 34" stroke="url(#ng)" stroke-width="2" stroke-linecap="round"/>
      <!-- synaptic terminals -->
      <circle cx="12" cy="18" r="3.2" fill="#22d3ee"/>
      <circle cx="20" cy="12" r="3" fill="#3b82f6"/>
      <circle cx="32" cy="8" r="3.2" fill="#a78bfa"/>
      <circle cx="44" cy="12" r="3" fill="#22d3ee"/>
      <circle cx="52" cy="18" r="3.2" fill="#a78bfa"/>
      <circle cx="50" cy="34" r="3" fill="#3b82f6"/>
      <!-- soma core -->
      <circle cx="32" cy="28" r="7" fill="url(#ng)"/>
      <circle cx="32" cy="28" r="3" fill="#e0f2fe"/>
      <!-- roots small -->
      <path d="M32 56 L22 62 M32 56 L42 62" stroke="url(#ng)" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    </svg>
    <span>هوش <b>درخشا</b></span>
  </a>

  <nav>
    <button type="button" class="active" data-p="chat" onclick="go('chat')">گفتگو</button>
    <button type="button" data-p="auth" onclick="go('auth')" id="navAuth">ورود</button>
  </nav>

  <div class="actions">
    <button type="button" class="btn-new" onclick="newChat()" title="گفتگوی جدید"><i>＋</i><span class="txt">جدید</span></button>
    <button type="button" onclick="openHistory()" title="تاریخچه">☰</button>
    <button type="button" id="themeBtn" onclick="toggleTheme()" title="تم" style="color:#fff;">☾</button>
  </div>
</header>

<!-- History drawer -->
<div class="drawer-bg" id="drawerBg" onclick="closeHistory()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span>تاریخچه گفتگو</span>
    <button type="button" class="btn-ghost" style="width:auto;padding:4px 10px;margin:0" onclick="closeHistory()">بستن</button>
  </div>
  <div class="drawer-list" id="historyList"></div>
</aside>

<main>
  <!-- CHAT -->
  <div class="chat-page active" id="page-chat">
    <div class="chat-body" id="msgs"></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="inp" rows="1" placeholder="پرسش خود را بنویسید..." onkeydown="onKey(event)" oninput="autoH(this)"></textarea>
        <button type="button" id="send" onclick="send()">↑</button>
      </div>
    </div>
  </div>

  

  <!-- AUTH -->
  <div class="page" id="page-auth">
    <div class="panel" style="max-width:400px">
      <h1 class="center">ورود به درخشا</h1>
      <p class="lead center">نام و شماره همراه</p>

      <div class="card" id="authForm">
        <div class="field">
          <label>نام</label>
          <input id="nameInput" type="text" placeholder="نام شما" maxlength="40" autocomplete="name">
        </div>
        <div class="field">
          <label>شماره همراه</label>
          <input id="phoneInput" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" autocomplete="tel">
        </div>
        <div class="field" id="otpField" style="display:none">
          <label>کد تأیید</label>
          <input id="otpInput" type="text" inputmode="numeric" placeholder="------" maxlength="6">
        </div>
        <button type="button" class="btn btn-primary" id="authBtn" onclick="authStep()">دریافت کد تأیید</button>
        <p class="muted center" style="margin-top:10px">کد آزمایشی: <strong style="color:var(--cyan)">123456</strong></p>
      </div>

      <div class="card center" id="authDone" style="display:none">
        <p>وارد شده‌اید</p>
        <p id="authInfo" style="color:var(--cyan);font-weight:600;margin:10px 0"></p>
        <button type="button" class="btn btn-ghost" onclick="logout()">خروج</button>
        <button type="button" class="btn btn-primary" onclick="go('chat')">رفتن به گفتگو</button>
      </div>
    </div>
  </div>
</main>

<nav class="nav-mobile">
  <button type="button" class="active" data-p="chat" onclick="go('chat')">گفتگو</button>
  <button type="button" data-p="auth" onclick="go('auth')">ورود</button>
</nav>

<footer>
  <div class="footer-inner">
    <div class="footer-links">
      <a href="#" onclick="go('auth');return false;">ورود</a>
      <span class="sep">|</span>
      <a href="#rules" onclick="showRules();return false;">قوانین درخشا</a>
      <span class="sep">|</span>
      <a href="#creators" onclick="showCreators();return false;">سازندگان</a>
    </div>
    <div class="footer-copy">
      © <span id="y"></span> درخت دانش <strong>درخشا</strong> — تمامی حقوق محفوظ است
    </div>
    <div class="footer-authors">
      سازندگان: <strong>گروک</strong> و <strong>احمدرضا ایزدی</strong>
    </div>
  </div>
</footer>

<div class="modal-bg" id="modalBg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-head">
    <strong id="modalTitle"></strong>
    <button type="button" class="modal-x" onclick="closeModal()">×</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const LOGO_SVG = `<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><path d="M32 56 V28" stroke="url(#a)" stroke-width="3" stroke-linecap="round"/><path d="M32 38 L10 22 M32 36 L16 12 M32 34 L26 8 M32 32 L32 6 M32 34 L38 8 M32 36 L48 12 M32 38 L54 22 M32 40 L54 36" stroke="url(#a)" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="22" r="2.6" fill="#22d3ee"/><circle cx="16" cy="12" r="2.5" fill="#3b82f6"/><circle cx="26" cy="8" r="2.5" fill="#a78bfa"/><circle cx="32" cy="6" r="2.6" fill="#22d3ee"/><circle cx="38" cy="8" r="2.5" fill="#3b82f6"/><circle cx="48" cy="12" r="2.5" fill="#a78bfa"/><circle cx="54" cy="22" r="2.6" fill="#22d3ee"/><circle cx="54" cy="36" r="2.5" fill="#3b82f6"/><circle cx="32" cy="28" r="6" fill="url(#a)"/><circle cx="32" cy="28" r="2.5" fill="#e0f2fe"/></svg>`;

const CORE = [
  {q:"درخشا چیست؟", a:"درخشا یک سامانه هوش مصنوعی فارسی با معماری درخت دانش است.", branch:"SELF", conf:96},
  {q:"درخت دانش چیست؟", a:"درخت دانش ساختار سلسله‌مراتبی با ریشه درخشا است؛ هر شاخه یک حوزه و هر مفهوم یک گره است.", branch:"ARCH", conf:94},
  {q:"چه قابلیت‌هایی دارد؟", a:"قشر زبان، درخت دانش، یادگیری، پیوند گفتگو و امتیاز اطمینان از قابلیت‌های اصلی درخشا هستند.", branch:"ARCH", conf:93},
  {q:"سازندگان کیانند؟", a:"درخشا توسط گروک و احمدرضا ایزدی طراحی شده است.", branch:"SELF", conf:98},
  {q:"سلام", a:"سلام. سامانه درخشا آماده دریافت پرسش شماست.", branch:"CHAT", conf:90}
];

let user = JSON.parse(localStorage.getItem("derakhsha_user") || "null");
let sessions = JSON.parse(localStorage.getItem("derakhsha_sessions") || "[]");
let currentId = localStorage.getItem("derakhsha_current") || null;
let authPhase = "phone"; // phone | otp

function save() {
  localStorage.setItem("derakhsha_sessions", JSON.stringify(sessions));
  if (currentId) localStorage.setItem("derakhsha_current", currentId);
}
function cur() { return sessions.find(s => s.id === currentId) || null; }
function ensure() {
  if (currentId && cur()) return cur();
  const s = { id: "s_" + Date.now(), title: "گفتگوی جدید", messages: [], updated: Date.now() };
  sessions.unshift(s);
  currentId = s.id;
  save();
  return s;
}

function go(p) {
  document.querySelectorAll(".page, .chat-page").forEach(el => el.classList.remove("active"));
  document.querySelectorAll("nav button, .nav-mobile button").forEach(b => b.classList.remove("active"));
  const el = document.getElementById("page-" + p);
  if (el) el.classList.add("active");
  document.querySelectorAll('[data-p="' + p + '"]').forEach(b => b.classList.add("active"));
  if (p === "auth") renderAuth();
  closeHistory();
}

function welcomeHTML() {
  return `<div class="welcome" id="welcome">
    ${LOGO_SVG.replace('width="24"','width="72"').replace(/viewBox/,'width="72" height="72" viewBox')}
    <h1>سامانه هوش مصنوعی درخشا</h1>
    <p>معماری درخت دانش · تحلیل جمله · طبقه‌بندی مفهومی</p>
    <div class="chips">
      <button type="button" onclick="ask(this)">درخشا چیست؟</button>
      <button type="button" onclick="ask(this)">درخت دانش چیست؟</button>
      <button type="button" onclick="ask(this)">چه قابلیت‌هایی دارد؟</button>
      <button type="button" onclick="ask(this)">سازندگان کیانند؟</button>
    </div>
  </div>`;
}

function renderMsgs() {
  const box = document.getElementById("msgs");
  const s = cur();
  if (!s || !s.messages.length) {
    box.innerHTML = welcomeHTML();
    return;
  }
  box.innerHTML = "";
  s.messages.forEach(m => {
    if (m.role === "user") addBubble(m.text, "user", null, false);
    else addBubble(m.text, "bot", m.meta, false);
  });
  box.scrollTop = box.scrollHeight;
}

function renderHistory() {
  const list = document.getElementById("historyList");
  if (!sessions.length) {
    list.innerHTML = '<div class="hist-empty">گفتگویی ذخیره نشده است.</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const d = new Date(s.updated).toLocaleString("fa-IR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<div class="hist ${s.id === currentId ? "active" : ""}">
      <button type="button" class="hist-main" onclick="loadSession('${s.id}')">
        <div class="t">${esc(s.title)}</div>
        <div class="d">${d} · ${s.messages.length} پیام</div>
      </button>
      <button type="button" class="hist-del" title="حذف این گفتگو" onclick="deleteSession('${s.id}', event)">×</button>
    </div>`;
  }).join("");
}

function loadSession(id) {
  currentId = id;
  save();
  renderMsgs();
  renderHistory();
  closeHistory();
  go("chat");
}

function deleteSession(id, ev) {
  if (ev) ev.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  if (currentId === id) {
    currentId = sessions.length ? sessions[0].id : null;
    if (!currentId) ensure();
  }
  save();
  renderHistory();
  renderMsgs();
  toast("گفتگو حذف شد");
}

function newChat() {
  go("chat");
  const s = { id: "s_" + Date.now(), title: "گفتگوی جدید", messages: [], updated: Date.now() };
  sessions.unshift(s);
  currentId = s.id;
  save();
  renderMsgs();
  renderHistory();
  toast("گفتگوی جدید");
}

function openHistory() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerBg").classList.add("open");
  renderHistory();
}
function closeHistory() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerBg").classList.remove("open");
}

function answer(q) {
  const qt = q.toLowerCase();
  let best = null, score = 0;
  for (const item of CORE) {
    const qs = item.q.toLowerCase();
    let sc = 0;
    if (qt.includes(qs) || qs.includes(qt)) sc = 0.95;
    else {
      const words = qt.split(/\s+/).filter(w => w.length > 2);
      const hits = words.filter(w => qs.includes(w) || item.a.includes(w)).length;
      sc = hits / Math.max(words.length, 1);
    }
    if (sc > score) { score = sc; best = item; }
  }
  if (best && score >= 0.28) return { text: best.a, src: "هسته دانش", conf: best.conf, branch: best.branch };
  return { text: "مسیر مطمئنی برای این پرسش فعال نشد. پرسش را دقیق‌تر بیان کنید.", src: "سامانه", conf: 15, branch: "—" };
}

function send() {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if (!text) return;
  const s = ensure();
  if (s.title === "گفتگوی جدید") s.title = text.slice(0, 36) + (text.length > 36 ? "…" : "");
  const w = document.getElementById("welcome");
  if (w) w.remove();
  s.messages.push({ role: "user", text });
  addBubble(text, "user", null, true);
  inp.value = "";
  autoH(inp);
  s.updated = Date.now();
  save();
  showTyping();
  setTimeout(() => {
    hideTyping();
    const r = answer(text);
    s.messages.push({ role: "bot", text: r.text, meta: r });
    s.updated = Date.now();
    save();
    addBubble(r.text, "bot", r, true);
    renderHistory();
  }, 600);
}

function showTyping() {
  const box = document.getElementById("msgs");
  const row = document.createElement("div");
  row.className = "row-bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="avatar busy">${LOGO_SVG}</div><div class="typing"><i></i><i></i><i></i></div>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typingRow");
  if (t) t.remove();
}

function addBubble(text, type, meta, scroll) {
  const box = document.getElementById("msgs");
  const time = new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
  if (type === "bot") {
    const row = document.createElement("div");
    row.className = "row-bot";
    let h = `<div class="avatar">${LOGO_SVG}</div><div class="bubble bot">${esc(text)}`;
    if (meta) {
      h += `<div class="tags">`;
      if (meta.src) h += `<span class="tag">${esc(meta.src)}</span>`;
      if (meta.conf != null) h += `<span class="tag">اطمینان ${meta.conf}٪</span>`;
      h += `</div>`;
    }
    h += `<div class="meta">درخشا · ${time}</div></div>`;
    row.innerHTML = h;
    box.appendChild(row);
  } else {
    const d = document.createElement("div");
    d.className = "bubble user";
    d.innerHTML = esc(text) + `<div class="meta">شما · ${time}</div>`;
    box.appendChild(d);
  }
  if (scroll) box.scrollTop = box.scrollHeight;
}

function ask(btn) {
  document.getElementById("inp").value = btn.textContent;
  send();
}
function onKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
}
function autoH(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

function renderAuth() {
  if (user && user.phone) {
    document.getElementById("authForm").style.display = "none";
    document.getElementById("authDone").style.display = "block";
    document.getElementById("authInfo").textContent = (user.name ? user.name + " · " : "") + user.phone;
  } else {
    document.getElementById("authDone").style.display = "none";
    document.getElementById("authForm").style.display = "block";
    document.getElementById("otpField").style.display = authPhase === "otp" ? "block" : "none";
    document.getElementById("authBtn").textContent = authPhase === "otp" ? "ورود" : "دریافت کد تأیید";
  }
  const nav = document.getElementById("navAuth");
  if (nav) nav.textContent = user && user.phone ? "حساب" : "ورود";
}

function authStep() {
  if (authPhase === "phone") {
    const name = document.getElementById("nameInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    if (!name) { toast("نام را وارد کنید"); return; }
    if (!/^09\d{9}$/.test(phone)) { toast("شماره معتبر: 09xxxxxxxxx"); return; }
    sessionStorage.setItem("derakhsha_pending", JSON.stringify({ name, phone }));
    authPhase = "otp";
    document.getElementById("otpField").style.display = "block";
    document.getElementById("authBtn").textContent = "ورود";
    toast("کد آزمایشی: 123456");
  } else {
    const otp = document.getElementById("otpInput").value.trim();
    if (otp !== "123456") { toast("کد نادرست است"); return; }
    const pending = JSON.parse(sessionStorage.getItem("derakhsha_pending") || "{}");
    user = { name: pending.name, phone: pending.phone, loggedAt: new Date().toISOString() };
    localStorage.setItem("derakhsha_user", JSON.stringify(user));
    authPhase = "phone";
    document.getElementById("otpInput").value = "";
    renderAuth();
    toast("ورود موفق");
  }
}

function logout() {
  user = null;
  localStorage.removeItem("derakhsha_user");
  authPhase = "phone";
  document.getElementById("otpField").style.display = "none";
  document.getElementById("authBtn").textContent = "دریافت کد تأیید";
  renderAuth();
  toast("خارج شدید");
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  const btn = document.getElementById("themeBtn");
  // همیشه سفید در تم تیره، در تم روشن تیره خوانا
  if (next === "dark") {
    btn.textContent = "☾";
    btn.style.color = "#ffffff";
  } else {
    btn.textContent = "☀";
    btn.style.color = "#0f1a2e";
  }
}

function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}


function showRules() {
  document.getElementById("modalTitle").textContent = "قوانین درخشا";
  document.getElementById("modalBody").innerHTML = `
    <ul>
      <li>استفاده از درخشا برای اهداف قانونی و اخلاقی مجاز است.</li>
      <li>مسئولیت محتوای پرسش‌ها و اسناد بارگذاری‌شده با کاربر است.</li>
      <li>اطلاعات حساب (نام و شماره) صرفاً برای ورود و بهبود سرویس استفاده می‌شود.</li>
      <li>پاسخ‌های سامانه جنبه راهنمایی دارند و جایگزین نظر تخصصی قطعی نیستند.</li>
      <li>هرگونه سوءاستفاده، انتشار بدافزار یا نقض حریم خصوصی ممنوع است.</li>
      <li>درخشا مخصوص کاربران فارسی‌زبان و با تمرکز بر ایران طراحی شده است.</li>
    </ul>
    <p style="margin-top:10px">با ورود یا استفاده از سامانه، این قوانین را پذیرفته‌اید.</p>`;
  openModal();
}
function showCreators() {
  document.getElementById("modalTitle").textContent = "سازندگان";
  document.getElementById("modalBody").innerHTML = `
    <p><strong style="color:var(--cyan)">گروک</strong> و <strong style="color:var(--cyan)">احمدرضا ایزدی</strong></p>
    <p style="margin-top:8px">طراحی و توسعه مفهومی سامانه هوش مصنوعی درخشا با معماری درخت دانش.</p>`;
  openModal();
}
function openModal() {
  document.getElementById("modalBg").classList.add("open");
  document.getElementById("modal").classList.add("open");
}
function closeModal() {
  document.getElementById("modalBg").classList.remove("open");
  document.getElementById("modal").classList.remove("open");
}

document.addEventListener("DOMContentLoaded", () => {
  const y = document.getElementById("y"); if (y) y.textContent = new Date().getFullYear();

  if (!sessions.length) ensure();
  else if (!currentId || !cur()) currentId = sessions[0].id;
  renderMsgs();
  renderHistory();
  renderAuth();
  document.getElementById("themeBtn").style.color = "#ffffff";
});
</script>
</body>
</html>
