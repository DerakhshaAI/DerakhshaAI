<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخشا</title>
<meta name="theme-color" content="#09090b">
<style>
:root{--bg:#09090b;--card:#12121a;--line:#1f1f2e;--text:#f4f4f5;--muted:#a1a1aa;--accent:#22d3ee;--blue:#3b82f6;--purple:#a78bfa;--font:Tahoma,"Segoe UI",system-ui,sans-serif}
[data-theme=light]{--bg:#fafafa;--card:#fff;--line:#e4e4e7;--text:#09090b;--muted:#71717a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65}
.top{height:58px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
[data-theme=light] .top{background:rgba(250,250,250,.92)}
.top-in{max-width:920px;margin:0 auto;height:100%;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:700}
.brand svg{width:32px;height:32px}
.brand em{font-style:normal;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.actions{display:flex;gap:6px;align-items:center}
.btn,.icon{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;gap:4px}
.icon{width:34px;padding:0;justify-content:center;color:#fff}
[data-theme=light] .icon{color:#09090b}
.btn-p{border:none;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff}
.shell{max-width:920px;margin:0 auto;min-height:calc(100vh - 58px - 70px);display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.on{display:flex}
.msgs{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:12px}
.hero{margin:auto;text-align:center;max-width:420px;padding:16px}
.hero svg{width:80px;height:80px;margin-bottom:10px}
.hero h1{font-size:1.4rem;margin-bottom:6px}
.hero p{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;font:inherit;font-size:.78rem;cursor:pointer}
.u{align-self:flex-end;max-width:78%;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;padding:11px 14px;border-radius:14px 14px 4px 14px;font-size:.9rem}
.bwrap{align-self:flex-start;display:flex;gap:8px;max-width:88%;align-items:flex-end}
.av{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex-shrink:0}
.av svg{width:18px;height:18px}
.b{background:var(--card);border:1px solid var(--line);padding:11px 14px;border-radius:14px 14px 14px 4px;font-size:.9rem}
.meta{font-size:.65rem;color:var(--muted);margin-top:5px}
.u .meta{color:rgba(255,255,255,.7)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill{font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(34,211,238,.12);color:var(--accent)}
.typing{display:flex;gap:8px;align-items:center}
.dots{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.4;display:block}
.dots i:first-child{opacity:1}
.bar{border-top:1px solid var(--line);padding:10px 14px 14px}
.comp{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.comp:focus-within{border-color:rgba(34,211,238,.45)}
#inp{flex:1;border:none;background:transparent;color:var(--text);font:inherit;font-size:.9rem;resize:none;outline:none;max-height:110px;padding:6px 0}
#send{width:38px;height:38px;border:none;border-radius:11px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;cursor:pointer;font-size:1rem}
.auth-box{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.auth-box h1{text-align:center;font-size:1.2rem;margin-bottom:6px}
.auth-box .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}
.field input:focus{border-color:var(--accent)}
.full{width:100%;justify-content:center;height:42px}
.foot{border-top:1px solid var(--line);padding:16px;text-align:center;color:var(--muted);font-size:.72rem}
.foot a{color:var(--muted);text-decoration:none;font-weight:600}
.foot a:hover{color:var(--accent)}
.foot strong{color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27272a;color:#fff;padding:8px 16px;border-radius:20px;font-size:.78rem;opacity:0;transition:.2s;z-index:50}
.toast.on{opacity:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;width:min(300px,90vw);height:100%;background:var(--bg);border-left:1px solid var(--line);z-index:31;transform:translateX(105%);transition:.2s;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dh{height:58px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700;font-size:.88rem}
.dl{flex:1;overflow-y:auto;padding:8px}
.hi{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.hi.active{border-color:var(--accent)}
.hi .pick{flex:1;border:none;background:0;color:var(--text);text-align:right;font:inherit;cursor:pointer;min-width:0}
.hi .t{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .d{font-size:.65rem;color:var(--muted)}
.hi .del{width:28px;height:28px;border:1px solid var(--line);background:0;color:#fb7185;border-radius:7px;cursor:pointer}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(400px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:40;max-height:80vh;overflow:auto}
.modal.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:.88rem}
.mb{padding:14px;color:var(--muted);font-size:.85rem}

.cap-logo{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;flex-shrink:0;
}
.cap-logo svg{width:16px;height:16px}
.cap-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cap-name{display:none !important;}
.b .typed{white-space:pre-wrap}
.cursor-blink{
  display:inline-block;width:2px;height:1em;background:var(--accent);
  margin-right:2px;vertical-align:text-bottom;animation:blink .7s step-end infinite;
}
@keyframes blink{50%{opacity:0}}
.typing-cap{display:flex;align-items:center;gap:8px;margin-bottom:4px}

</style>
</head>
<body>
<header class="top"><div class="top-in">
<a class="brand" href="#" onclick="show('chat');return false;">
<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>
<path d="M32 6 L56 24 L47 54 L17 54 L8 24 Z" stroke="url(#g)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
<path d="M32 14 L48 27 L42 48 L22 48 L16 27 Z" stroke="url(#g)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
<path d="M32 22 L40 30 L37 42 L27 42 L24 30 Z" stroke="url(#g)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<circle cx="32" cy="34" r="3.2" fill="url(#g)"/></svg>
<span>هوش <em>درخشا</em></span>
</a>
<div class="actions">
<button type="button" class="btn" onclick="newChat()">＋ جدید</button>
<button type="button" class="icon" onclick="openHist()" title="تاریخچه">☰</button>
<button type="button" class="icon" id="th" onclick="theme()" style="color:#fff">☾</button>
<button type="button" class="btn btn-p" id="navAuth" onclick="show('auth')">ورود</button>
</div>
</div></header>

<div class="overlay" id="ov" onclick="closeAll()"></div>
<aside class="drawer" id="dr">
<div class="dh"><span>تاریخچه</span><button type="button" class="btn" style="height:30px;padding:0 10px" onclick="closeAll()">بستن</button></div>
<div class="dl" id="hist"></div>
</aside>

<div class="shell">
<section class="view on" id="v-chat">
<div class="msgs" id="msgs"></div>
<div class="bar"><div class="comp">
<textarea id="inp" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
<button type="button" id="send" onclick="send()">↑</button>
</div></div>
</section>
<section class="view" id="v-auth">
<div class="auth-box" id="authBox">
<div id="authForm">
<h1>ورود به درخشا</h1>
<p class="sub">نام و شماره همراه</p>
<div class="field"><label>نام</label><input id="nameIn" maxlength="40" placeholder="نام شما"></div>
<div class="field"><label>شماره همراه</label><input id="phoneIn" maxlength="11" placeholder="09xxxxxxxxx" inputmode="numeric"></div>
<div class="field" id="otpF" style="display:none"><label>کد تأیید</label><input id="otpIn" maxlength="6" placeholder="------" inputmode="numeric"></div>
<button type="button" class="btn btn-p full" id="authBtn" onclick="authStep()">دریافت کد</button>
<p class="sub" style="margin-top:12px">کد آزمایشی: <strong style="color:var(--accent)">123456</strong></p>
</div>
<div id="authDone" style="display:none">
<h1>حساب</h1>
<p id="authInfo" style="text-align:center;color:var(--accent);font-weight:600;margin:12px 0"></p>
<button type="button" class="btn full" onclick="logout()">خروج</button>
<button type="button" class="btn btn-p full" style="margin-top:8px" onclick="show('chat')">گفتگو</button>
</div>
</div>
</section>
</div>

<footer class="foot">
<div style="margin-bottom:6px">
<a href="#" onclick="show('auth');return false;">ورود</a> ·
<a href="#" onclick="rules();return false;">قوانین درخشا</a> ·
<a href="#" onclick="creators();return false;">سازندگان</a>
</div>
<div>© <span id="y"></span> درخت دانش <strong>درخشا</strong> — تمامی حقوق محفوظ است</div>
<div style="margin-top:4px">گروک × احمدرضا ایزدی</div>
</footer>

<div class="modal" id="modal"><div class="mh"><span id="mt"></span><button type="button" onclick="closeAll()" style="border:0;background:0;color:var(--text);font-size:1.2rem;cursor:pointer">×</button></div><div class="mb" id="mb"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = window.DERAKHSHA_API || "";
const MARK = `<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="m" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><path d="M32 6 L56 24 L47 54 L17 54 L8 24 Z" stroke="url(#m)" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M32 14 L48 27 L42 48 L22 48 L16 27 Z" stroke="url(#m)" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M32 22 L40 30 L37 42 L27 42 L24 30 Z" stroke="url(#m)" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="32" cy="34" r="3" fill="url(#m)"/></svg>`;

/* لوگوی هر قابلیت موتور */
const CAP = {
  tree: {
    name: "درخت دانش",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8"><path d="M12 20V10"/><path d="M12 10L7 5M12 10l5-5M12 14L6 12M12 14l6-2"/><circle cx="7" cy="5" r="1.5" fill="#22d3ee"/><circle cx="17" cy="5" r="1.5" fill="#a78bfa"/><circle cx="6" cy="12" r="1.3" fill="#3b82f6"/><circle cx="18" cy="12" r="1.3" fill="#22d3ee"/></svg>`
  },
  relations: {
    name: "روابط مفاهیم",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8"><circle cx="6" cy="6" r="2.2" fill="#a78bfa"/><circle cx="18" cy="6" r="2.2" fill="#22d3ee"/><circle cx="12" cy="18" r="2.2" fill="#3b82f6"/><path d="M8 7.5L10.5 15M16 7.5L13.5 15M8.5 6h7"/></svg>`
  },
  multi_step: {
    name: "استدلال چندمرحله‌ای",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.8"><path d="M5 6h6v4H5zM13 10h6v4h-6zM5 14h6v4H5z" fill="rgba(59,130,246,.2)"/><path d="M11 8h2M11 12h2" stroke-linecap="round"/></svg>`
  },
  consistency_fix: {
    name: "کنترل صحت",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>`
  },
  clarify: {
    name: "مدیریت ابهام",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16h.01M10 9a2 2 0 013.5 1.5c0 1.5-2 2-2 3" stroke-linecap="round"/></svg>`
  },
  discovery: {
    name: "کشف واژه",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/><path d="M11 8v6M8 11h6" stroke-linecap="round"/></svg>`
  },
  language: {
    name: "قشر زبان",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="18" cy="12" r="2" fill="#a78bfa"/></svg>`
  },
  semantics: {
    name: "درک معنایی",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8"><circle cx="9" cy="12" r="4"/><circle cx="15" cy="12" r="4"/><path d="M9 12h6"/></svg>`
  },
  default: {
    name: "موتور درخشا",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.6"><path d="M12 2l7 5v7c0 4-3 6.5-7 7.5C8 20.5 5 18 5 14V7l7-5z"/></svg>`
  }
};

function capFor(route, source) {
  const r = (route || "").toLowerCase();
  const s = (source || "");
  if (r === "relations" || s.includes("روابط")) return CAP.relations;
  if (r === "multi_step" || s.includes("استدلال")) return CAP.multi_step;
  if (r === "consistency_fix" || s.includes("صحت")) return CAP.consistency_fix;
  if (r === "clarify" || s.includes("شفاف")) return CAP.clarify;
  if (s.includes("کشف") || r === "discovery") return CAP.discovery;
  if (r === "tree" || s.includes("هسته") || s.includes("سند")) return CAP.tree;
  if (s.includes("معنا")) return CAP.semantics;
  return CAP.default;
}

let user = JSON.parse(localStorage.getItem("derakhsha_user")||"null");
let sessions = JSON.parse(localStorage.getItem("derakhsha_sessions")||"[]");
let currentId = localStorage.getItem("derakhsha_current")||null;
let authPhase = "form";
let typingLock = false;
const sid = () => (user && user.phone ? "u_"+user.phone : "anon") + "_" + (currentId||"x");

function save(){localStorage.setItem("derakhsha_sessions",JSON.stringify(sessions));if(currentId)localStorage.setItem("derakhsha_current",currentId)}
function cur(){return sessions.find(s=>s.id===currentId)||null}
function ensure(){if(currentId&&cur())return cur();const s={id:"s_"+Date.now(),title:"گفتگوی جدید",messages:[],updated:Date.now()};sessions.unshift(s);currentId=s.id;save();return s}

function show(v){document.querySelectorAll(".view").forEach(e=>e.classList.remove("on"));document.getElementById("v-"+v).classList.add("on");if(v==="auth")renderAuth();closeAll()}
function hero(){return `<div class="hero" id="welcome">${MARK.replace("viewBox",'width="80" height="80" viewBox')}<h1>درخشا</h1><p>سامانه هوش مصنوعی فارسی با معماری درخت دانش</p><div class="chips"><button type="button" onclick="ask(this)">درخشا چیست؟</button><button type="button" onclick="ask(this)">درخت دانش چیست؟</button><button type="button" onclick="ask(this)">سازندگان کیانند؟</button></div></div>`}
function renderMsgs(){
  const box=document.getElementById("msgs");const s=cur();
  if(!s||!s.messages.length){box.innerHTML=hero();return}
  box.innerHTML="";
  s.messages.forEach(m=>{
    if(m.role==="user") addU(m.text,false);
    else addBInstant(m.text,m.meta);
  });
  box.scrollTop=box.scrollHeight;
}
function renderHist(){
  const list=document.getElementById("hist");
  if(!sessions.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:24px;font-size:.85rem">خالی</div>';return}
  list.innerHTML=sessions.map(s=>{
    const d=new Date(s.updated).toLocaleString("fa-IR",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    return `<div class="hi ${s.id===currentId?"active":""}"><button type="button" class="pick" onclick="load('${s.id}')"><div class="t">${esc(s.title)}</div><div class="d">${d}</div></button><button type="button" class="del" onclick="delS('${s.id}',event)">×</button></div>`;
  }).join("");
}
function load(id){currentId=id;save();renderMsgs();renderHist();show("chat")}
function delS(id,ev){if(ev)ev.stopPropagation();sessions=sessions.filter(x=>x.id!==id);if(currentId===id){currentId=sessions[0]?sessions[0].id:null;if(!currentId)ensure()}save();renderHist();renderMsgs();toast("حذف شد")}
function newChat(){const s={id:"s_"+Date.now(),title:"گفتگوی جدید",messages:[],updated:Date.now()};sessions.unshift(s);currentId=s.id;save();show("chat");renderMsgs();renderHist();toast("گفتگوی جدید")}
function openHist(){document.getElementById("dr").classList.add("on");document.getElementById("ov").classList.add("on");renderHist()}
function closeAll(){document.getElementById("dr").classList.remove("on");document.getElementById("ov").classList.remove("on");document.getElementById("modal").classList.remove("on")}

async function send(){
  if(typingLock) return;
  const inp=document.getElementById("inp");const text=inp.value.trim();if(!text)return;
  const s=ensure();if(s.title==="گفتگوی جدید")s.title=text.slice(0,36)+(text.length>36?"…":"");
  const w=document.getElementById("welcome");if(w)w.remove();
  s.messages.push({role:"user",text});addU(text,true);inp.value="";autoH(inp);s.updated=Date.now();save();
  showTyping(CAP.default);
  try{
    const res=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,session_id:sid()})});
    const data=await res.json();
    const cap = capFor(data.route, data.source);
    // به‌روزرسانی لوگوی حالت فکر با قابلیت واقعی
    updateTypingCap(cap);
    await sleep(280);
    hideTyping();
    const meta={src:data.source,conf:data.confidence,branch:data.branch,route:data.route};
    const answer = data.answer || "پاسخی دریافت نشد";
    s.messages.push({role:"bot",text:answer,meta});
    s.updated=Date.now();save();
    await typeBot(answer, meta, cap);
    renderHist();
  }catch(err){
    hideTyping();
    const msg="اتصال به موتور برقرار نشد. سرور را بررسی کنید.";
    s.messages.push({role:"bot",text:msg,meta:{src:"خطا",conf:0,route:"clarify"}});
    await typeBot(msg,{src:"خطا",conf:0,route:"clarify"},CAP.clarify);
  }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function showTyping(cap){
  const box=document.getElementById("msgs");
  const el=document.createElement("div");
  el.className="typing"; el.id="ty";
  el.innerHTML = `
    <div class="av">${MARK}</div>
    <div>
      <div class="typing-cap" id="tyCap">
        <div class="cap-logo" title="${esc(cap.name)}">${cap.svg}</div>
      </div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>`;
  box.appendChild(el); box.scrollTop=box.scrollHeight;
}
function updateTypingCap(cap){
  const el=document.getElementById("tyCap");
  if(!el) return;
  el.innerHTML = `<div class="cap-logo" title="${esc(cap.name)}">${cap.svg}</div>`;
}
function hideTyping(){const t=document.getElementById("ty");if(t)t.remove()}

function addU(text,sc){
  const box=document.getElementById("msgs");
  const t=new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  const d=document.createElement("div"); d.className="u";
  d.innerHTML=esc(text)+`<div class="meta">${t}</div>`;
  box.appendChild(d); if(sc) box.scrollTop=box.scrollHeight;
}

function addBInstant(text, meta){
  const cap = capFor(meta&&meta.route, meta&&meta.src);
  const box=document.getElementById("msgs");
  const t=new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  const row=document.createElement("div"); row.className="bwrap";
  let h=`<div class="av">${MARK}</div><div class="b">`;
  h+=`<div class="cap-row"><div class="cap-logo" title="${esc(cap.name)}">${cap.svg}</div></div>`;
  h+=`<div class="typed">${esc(text)}</div>`;
  if(meta){
    h+=`<div class="pills">`;
    if(meta.src) h+=`<span class="pill">${esc(meta.src)}</span>`;
    if(meta.conf!=null) h+=`<span class="pill">${meta.conf}٪</span>`;
    if(meta.branch) h+=`<span class="pill">${esc(meta.branch)}</span>`;
    h+=`</div>`;
  }
  h+=`<div class="meta">درخشا · ${t}</div></div>`;
  row.innerHTML=h; box.appendChild(row);
}

async function typeBot(text, meta, cap){
  typingLock = true;
  const box=document.getElementById("msgs");
  const t=new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  const row=document.createElement("div"); row.className="bwrap";
  row.innerHTML = `
    <div class="av">${MARK}</div>
    <div class="b">
      <div class="cap-row">
        <div class="cap-logo" title="${esc(cap.name)}">${cap.svg}</div>
      </div>
      <div class="typed" id="typedActive"></div>
      <div class="pills" id="pillsActive" style="display:none"></div>
      <div class="meta" id="metaActive" style="display:none">درخشا · ${t}</div>
    </div>`;
  box.appendChild(row);
  const typed = document.getElementById("typedActive");
  const speed = text.length > 400 ? 8 : text.length > 150 ? 12 : 16;
  let i = 0;
  while(i < text.length){
    // چند کاراکتر در هر فریم برای متن بلند
    const step = text.length > 300 ? 3 : 1;
    i = Math.min(text.length, i + step);
    typed.textContent = text.slice(0, i);
    typed.innerHTML = esc(text.slice(0, i)) + (i < text.length ? '<span class="cursor-blink"></span>' : '');
    box.scrollTop = box.scrollHeight;
    await sleep(speed);
  }
  typed.textContent = text;
  typed.innerHTML = esc(text);
  if(meta){
    const pills=document.getElementById("pillsActive");
    if(pills){
      pills.style.display="flex";
      let ph="";
      if(meta.src) ph+=`<span class="pill">${esc(meta.src)}</span>`;
      if(meta.conf!=null) ph+=`<span class="pill">${meta.conf}٪</span>`;
      if(meta.branch) ph+=`<span class="pill">${esc(meta.branch)}</span>`;
      pills.innerHTML=ph;
    }
  }
  const metaEl=document.getElementById("metaActive");
  if(metaEl){ metaEl.style.display="block"; metaEl.removeAttribute("id"); }
  typed.removeAttribute("id");
  if(document.getElementById("pillsActive")) document.getElementById("pillsActive").removeAttribute("id");
  typingLock = false;
}

function ask(b){document.getElementById("inp").value=b.textContent;send()}
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
function autoH(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,110)+"px"}
document.getElementById("inp").addEventListener("input",function(){autoH(this)});

function renderAuth(){
  if(user&&user.phone){
    document.getElementById("authForm").style.display="none";
    document.getElementById("authDone").style.display="block";
    document.getElementById("authInfo").textContent=(user.name?user.name+" · ":"")+user.phone;
    document.getElementById("navAuth").textContent="حساب";
  } else {
    document.getElementById("authDone").style.display="none";
    document.getElementById("authForm").style.display="block";
    document.getElementById("otpF").style.display=authPhase==="otp"?"block":"none";
    document.getElementById("authBtn").textContent=authPhase==="otp"?"ورود":"دریافت کد";
    document.getElementById("navAuth").textContent="ورود";
  }
}
function authStep(){
  if(authPhase==="form"){
    const name=document.getElementById("nameIn").value.trim();
    const phone=document.getElementById("phoneIn").value.trim();
    if(!name){toast("نام را وارد کنید");return}
    if(!/^09\d{9}$/.test(phone)){toast("شماره نامعتبر");return}
    sessionStorage.setItem("p",JSON.stringify({name,phone}));
    authPhase="otp";
    document.getElementById("otpF").style.display="block";
    document.getElementById("authBtn").textContent="ورود";
    toast("کد: 123456");
  } else {
    if(document.getElementById("otpIn").value.trim()!=="123456"){toast("کد نادرست");return}
    const p=JSON.parse(sessionStorage.getItem("p")||"{}");
    user={name:p.name,phone:p.phone};
    localStorage.setItem("derakhsha_user",JSON.stringify(user));
    authPhase="form"; renderAuth(); toast("ورود موفق");
  }
}
function logout(){user=null;localStorage.removeItem("derakhsha_user");authPhase="form";document.getElementById("otpF").style.display="none";renderAuth();toast("خارج شدید")}
function theme(){
  const n=(document.documentElement.getAttribute("data-theme")||"dark")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  const b=document.getElementById("th");
  if(n==="dark"){b.textContent="☾";b.style.color="#fff"}else{b.textContent="☀";b.style.color="#09090b"}
}

}
function creators(){
  document.getElementById("mt").textContent="سازندگان";
  document.getElementById("mb").innerHTML="<p><strong style='color:var(--accent)'>گروک</strong> و <strong style='color:var(--accent)'>احمدرضا ایزدی</strong></p>";
  document.getElementById("modal").classList.add("on");document.getElementById("ov").classList.add("on");
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2000)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("y").textContent=new Date().getFullYear();
  if(!sessions.length) ensure();
  else if(!currentId||!cur()) currentId=sessions[0].id;
  renderMsgs(); renderHist(); renderAuth();
});
</script>
